name: antar-infra

services:

  # ─────────────────────────────────────────
  # REDIS — Streaming URL Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: redis-antar
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - infra

  # ─────────────────────────────────────────
  # ZOOKEEPER — Required by Kafka
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - infra

  # ─────────────────────────────────────────
  # KAFKA — Event Streaming
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${INFRA_HOST:?set INFRA_HOST in .env}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - infra

  # ─────────────────────────────────────────
  # POSTGRES — auth-service identity store
  # ─────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres-antar
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD} # bootstrap-only superuser; no app connects as this role
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      STREAMING_DB_PASSWORD: ${STREAMING_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - infra

  # ─────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────

  # nas-orchestrator
  nas-orchestrator:
    build:
      context: .
      dockerfile: nas-orchestrator/Dockerfile
    container_name: nas-orchestrator
    env_file:
      - ./nas-orchestrator/.env
    environment:
      HEARTH_HOST: ${HEARTH_HOST:?set HEARTH_HOST in .env}
    ports:
      - "8081:8081"
      - "4092:4092"
    depends_on:
      redis:
        condition: service_started
    networks:
      - infra

  # video-service
  video-service:
    build:
      context: .
      dockerfile: video-service/Dockerfile
    container_name: video-service
    env_file:
      - ./video-service/.env
    environment:
      HEARTH_HOST: ${HEARTH_HOST:?set HEARTH_HOST in .env}
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - infra

  # encoding-service
  encoding-service:
    build:
      context: .
      dockerfile: encoding-service/Dockerfile
    container_name: encoding-service
    env_file:
      - ./encoding-service/.env
    environment:
      HEARTH_HOST: ${HEARTH_HOST:?set HEARTH_HOST in .env}
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - infra

networks:
  infra:
    name: infra
    driver: bridge

volumes:
  redis-data:
  postgres-data: